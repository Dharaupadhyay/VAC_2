<script>
    // JavaScript object
    let student = {
        name: "John Doe",
        age: 30,
        course: "Computer Science",
        isactive: true
    };

    // Convert JavaScript object to JSON string
    let jsonString = JSON.stringify(student);
    console.log(jsonString);
</script>
